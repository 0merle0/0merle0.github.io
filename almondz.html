  <h1>almondz</h1>
  <p class="tagline">Sewing and other art projects.</p>

  <div class="product">
    <div class="product-photos">
      <p>Photos coming soon.</p>

    <input type="hidden" name="_next" value="https://jacobgershon.com/thanks.html">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>Name <input type="text" name="name" required autocomplete="name"></label>
    <label>Email <input type="email" name="email" required autocomplete="email"></label>
    <label>Anything you have in mind (colors, fabric, size, timing)
      <textarea name="details" rows="5"></textarea></label>
    <button type="submit">send request</button>
  </form>

  <p>More on Instagram: <a href="https://www.instagram.com/__almondz__/">@__almondz__</a></p>
